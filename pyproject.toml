[project]
name = "herat-nerkhbot"
version = "0.1.0"
description = "Collects exchange-rate posts from Herat market Telegram channels into a database and parses them into prices."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.36",            # Telegram client (logs in as a user account)
    "sqlalchemy>=2.0",           # database layer (SQLite now, Postgres later)
    "pydantic-settings>=2.2",    # typed settings loaded from .env
    "apscheduler>=3.10,<4",      # periodic catch-up job
    "loguru>=0.7",               # logging to console + rotating file
    "tenacity>=8.2",             # retries on network errors
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nerkhbot = "nerkhbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nerkhbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
